name: Build Technetium
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MSYS_NO_PATHCONV: 1
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: r28b

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # 0.19.0
        with:
          repository-cache: MODULE.bazel.lock

      # 复用 TC 的 remote cache action;fork 未配置 secret 时会生成空缓存,不会失败。
      - name: Setup Remote Cache (optional)
        uses: ./.github/actions/setup-bazel-cache

      - name: Build Technetium (fabric + neoforge, 26.2)
        run: |
          bazel build --verbose_failures --config=opt \
            //technetium/versions/fabric/26.2:technetium \
            //technetium/versions/neoforge/26.2:neoforge

      - name: Upload fabric artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: technetium-fabric-26.2
          path: bazel-bin/technetium/versions/fabric/26.2/technetium.jar
          if-no-files-found: warn

      - name: Upload neoforge artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: technetium-neoforge-26.2
          path: bazel-bin/technetium/versions/neoforge/26.2/neoforge.jar
          if-no-files-found: warn
